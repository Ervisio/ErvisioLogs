# Ervisio Logs: compact deployment (Go app + PostgreSQL + ClickHouse).
# Usage: scripts/gen-env.sh && docker compose --env-file .env -f deploy/compose.yaml up -d --build
# Databases are on a private network and are NOT published to the host (see compose.dev.yaml).

name: ervisio-logs

x-app-env: &app-env
  ERVISIO_LOGS_ENV: ${ERVISIO_LOGS_ENV:-development}
  ERVISIO_LOGS_LOG_LEVEL: ${ERVISIO_LOGS_LOG_LEVEL:-info}
  # The bundled PostgreSQL serves TLS with a certificate made by the pg-tls job; the app checks it against that same
  # certificate (verify-full), so production mode works with the bundled database. Set a full DSN to use another server.
  ERVISIO_LOGS_POSTGRES_DSN: ${ERVISIO_LOGS_POSTGRES_DSN:-postgres://ervisio_logs:${POSTGRES_PASSWORD:?run scripts/gen-env.sh}@postgres:5432/ervisio_logs?sslmode=${POSTGRES_SSLMODE:-verify-full}&sslrootcert=/var/lib/ervisio-logs/tls/server.crt}
  ERVISIO_LOGS_CLICKHOUSE_ADDR: ${ERVISIO_LOGS_CLICKHOUSE_ADDR:-clickhouse:9000}
  ERVISIO_LOGS_CLICKHOUSE_DATABASE: ervisio_logs
  ERVISIO_LOGS_CLICKHOUSE_USER: ervisio_logs
  ERVISIO_LOGS_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run scripts/gen-env.sh}
  ERVISIO_LOGS_CLICKHOUSE_TLS: ${ERVISIO_LOGS_CLICKHOUSE_TLS:-false}
  ERVISIO_LOGS_SECRET_KEY: ${ERVISIO_LOGS_SECRET_KEY:?run scripts/gen-env.sh}
  ERVISIO_LOGS_PUBLIC_URL: ${ERVISIO_LOGS_PUBLIC_URL:?run scripts/gen-env.sh}
  ERVISIO_LOGS_OPEN_REGISTRATION: ${ERVISIO_LOGS_OPEN_REGISTRATION:-false}
  ERVISIO_LOGS_SETUP_CODE: ${ERVISIO_LOGS_SETUP_CODE:-}
  ERVISIO_LOGS_SESSION_TTL: ${ERVISIO_LOGS_SESSION_TTL:-336h}
  ERVISIO_LOGS_TRUST_PROXY: ${ERVISIO_LOGS_TRUST_PROXY:-false}
  ERVISIO_LOGS_GOOGLE_CLIENT_ID: ${ERVISIO_LOGS_GOOGLE_CLIENT_ID:-}
  ERVISIO_LOGS_GOOGLE_CLIENT_SECRET: ${ERVISIO_LOGS_GOOGLE_CLIENT_SECRET:-}
  ERVISIO_LOGS_COGNITO_CLIENT_ID: ${ERVISIO_LOGS_COGNITO_CLIENT_ID:-}
  ERVISIO_LOGS_COGNITO_CLIENT_SECRET: ${ERVISIO_LOGS_COGNITO_CLIENT_SECRET:-}
  ERVISIO_LOGS_COGNITO_ISSUER: ${ERVISIO_LOGS_COGNITO_ISSUER:-}
  ERVISIO_LOGS_DISCORD_CLIENT_ID: ${ERVISIO_LOGS_DISCORD_CLIENT_ID:-}
  ERVISIO_LOGS_DISCORD_CLIENT_SECRET: ${ERVISIO_LOGS_DISCORD_CLIENT_SECRET:-}
  ERVISIO_LOGS_SPOOL_MAX_BYTES: ${ERVISIO_LOGS_SPOOL_MAX_BYTES:-1073741824}
  ERVISIO_LOGS_INGEST_MAX_FUTURE_SKEW: ${ERVISIO_LOGS_INGEST_MAX_FUTURE_SKEW:-5m}
  ERVISIO_LOGS_INGEST_MAX_PAST_AGE: ${ERVISIO_LOGS_INGEST_MAX_PAST_AGE:-168h}
  ERVISIO_LOGS_ALERTS_INTERVAL: ${ERVISIO_LOGS_ALERTS_INTERVAL:-30s}
  ERVISIO_LOGS_ALERTS_HISTORY_RETENTION: ${ERVISIO_LOGS_ALERTS_HISTORY_RETENTION:-720h}
  ERVISIO_LOGS_WEBHOOK_ALLOW_PRIVATE: ${ERVISIO_LOGS_WEBHOOK_ALLOW_PRIVATE:-false}
  ERVISIO_LOGS_EXPORT_MAX_ROWS: ${ERVISIO_LOGS_EXPORT_MAX_ROWS:-1000000}
  ERVISIO_LOGS_METRICS_TOKEN: ${ERVISIO_LOGS_METRICS_TOKEN:-}

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  restart: unless-stopped

services:
  # One-shot job: a self-signed certificate for PostgreSQL in the pg-tls volume, kept across restarts.
  pg-tls:
    build: { context: .., dockerfile: Dockerfile }
    image: ${ERVISIO_LOGS_IMAGE:-ervisio-logs:dev}
    command: ["tls-cert", "--dir", "/var/lib/ervisio-logs/tls", "--host", "postgres"]
    volumes: [pg-tls:/var/lib/ervisio-logs/tls]
    healthcheck: { disable: true }
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true

  postgres:
    <<: *hardening
    # Pinned by digest (verified 2026-11-02, linux/amd64+arm64 index). Bump deliberately.
    image: postgres:17-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
    environment:
      POSTGRES_DB: ervisio_logs
      POSTGRES_USER: ervisio_logs
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/gen-env.sh}
    # PostgreSQL wants its key owned by itself with mode 0600: copy it out of the job's volume before the
    # official entrypoint starts the server with TLS on.
    entrypoint:
      - sh
      - -c
      - >-
        install -d -o postgres -g postgres -m 0700 /var/lib/postgresql/tls &&
        install -o postgres -g postgres -m 0600 /tls/server.key /var/lib/postgresql/tls/server.key &&
        install -o postgres -g postgres -m 0644 /tls/server.crt /var/lib/postgresql/tls/server.crt &&
        exec docker-entrypoint.sh "$@"
      - --
    command: ["postgres", "-c", "ssl=on", "-c", "ssl_cert_file=/var/lib/postgresql/tls/server.crt", "-c", "ssl_key_file=/var/lib/postgresql/tls/server.key"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - pg-tls:/tls:ro
    depends_on:
      pg-tls: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ervisio_logs -d ervisio_logs"]
      interval: 5s
      timeout: 3s
      retries: 20
    # postgres needs a few capabilities to drop privileges at start-up
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    mem_limit: 1g

  clickhouse:
    <<: *hardening
    image: clickhouse/clickhouse-server:25.8-alpine@sha256:87e0a5b72f5465b18eacca7c76850e7ff551c9795c50e451f5646299e5e24146
    environment:
      CLICKHOUSE_DB: ervisio_logs
      CLICKHOUSE_USER: ervisio_logs
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?run scripts/gen-env.sh}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
      # The entrypoint chowns /var/lib/clickhouse recursively and exits on the read-only archive
      # mount below. The named data volume already gets the image's clickhouse ownership.
      CLICKHOUSE_DO_NOT_CHOWN: "1"
    # The archive cache, read-only: ClickHouse reads Parquet segments from it with file() and
    # never writes there. The app is the only writer (ADR 0008).
    volumes:
      - ch-data:/var/lib/clickhouse
      - cache:/var/lib/clickhouse/user_files/ervisio-archive:ro
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID, KILL, SYS_NICE, IPC_LOCK]
    mem_limit: 2g

  # One-shot migration job. The app reports "not ready" until it has completed.
  migrate:
    build: { context: .., dockerfile: Dockerfile }
    image: ${ERVISIO_LOGS_IMAGE:-ervisio-logs:dev}
    command: ["migrate", "up"]
    environment: *app-env
    # The image HEALTHCHECK probes the HTTP server, which this one-shot job never starts.
    healthcheck: { disable: true }
    depends_on:
      postgres: { condition: service_healthy }
      clickhouse: { condition: service_healthy }
    restart: "no"
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    read_only: true
    volumes: [pg-tls:/var/lib/ervisio-logs/tls:ro]

  app:
    <<: *hardening
    image: ${ERVISIO_LOGS_IMAGE:-ervisio-logs:dev}
    command: ["serve"]
    environment:
      <<: *app-env
      ERVISIO_LOGS_HTTP_ADDR: ":8080"
      # Credentials of archive destinations (Storage page): one file each, named in the destination.
      ERVISIO_LOGS_ARCHIVE_SECRETS_DIR: /run/ervisio-logs/secrets
    ports:
      # Loopback only: put a TLS reverse proxy in front for anything beyond local use.
      - "127.0.0.1:${ERVISIO_LOGS_PORT:-8080}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
    read_only: true
    tmpfs: ["/tmp:size=16m"]
    # The spool holds acknowledged events until ClickHouse has them: losing this volume loses
    # those events. The cache volume is for the archive tier (P4). The image owns these paths as
    # the non-root user, which Docker copies onto a volume when it is first created.
    volumes:
      - spool:/var/lib/ervisio-logs/spool
      - cache:/var/lib/ervisio-logs/cache
      - pg-tls:/var/lib/ervisio-logs/tls:ro
      # A host folder next to compose.yaml, owned by uid 65532 with mode 0700 (the Ervisio plugin sets this up).
      - ./secrets:/run/ervisio-logs/secrets:ro
    # edge: the network a reverse proxy in Docker (Caddy) joins to reach the app, and nothing else, as
    # ervisio-logs-app:8080. The Ervisio plugin attaches a Caddy container to it when it publishes the site.
    networks:
      default: {}
      edge: { aliases: [ervisio-logs-app] }
    mem_limit: 512m

networks:
  default: {}
  edge:
    name: ervisiologs_edge

volumes:
  pg-tls:
  pg-data:
  ch-data:
  spool:
  cache:
