          format: email
        role:
          $ref: "#/components/schemas/Role"
        expires_at:
          type: string
          format: date-time
        has_account:
          type: boolean
      additionalProperties: false
    Member:
      type: object
      required: [user_id, email, username, role, joined_at]
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        joined_at:
          type: string
          format: date-time
      additionalProperties: false
    Project:
      type: object
      required: [id, workspace_id, slug, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    Environment:
      type: object
      required: [id, project_id, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    Stream:
      type: object
      required: [id, project_id, name, type, created_at]
      properties:
        id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [logs]
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    ApiToken:
      type: object
      required:
        - id
        - workspace_id
        - project_id
        - name
        - prefix
        - scopes
        - created_at
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
          description: "First characters, safe to display."
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: [string, "null"]
          format: date-time
        last_used_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
      additionalProperties: false
    AuditEvent:
      type: object
      required: [id, action, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: [string, "null"]
          format: uuid
        actor_user_id:
          type: [string, "null"]
          format: uuid
        actor_token_id:
          type: [string, "null"]
          format: uuid
        action:
          type: string
          examples: [token.create]
        target_type:
          type: string
        target_id:
          type: string
        request_id:
          type: string
        ip:
          type: string
        detail:
          type: object
        created_at:
          type: string
          format: date-time
      description: Never contains secrets.
      additionalProperties: false
    AuthProviders:
      type: object
      required: [local, providers, open_registration, setup_required, email]
      properties:
        local:
          type: boolean
        email:
          type: boolean
          description: "Email is configured: password reset links and emailed invitations work."
        providers:
          type: array
          items:
            type: string
            enum: [google, cognito, discord]
        open_registration:
          type: boolean
        setup_required:
          type: boolean
          description: True until the first account (the instance administrator) exists.
      additionalProperties: false
    RegisterRequest:
      type: object
      required: [email, username, password]
      properties:
        email:
          type: string
          format: email
        username:
          type: string
          pattern: "^[a-z0-9][a-z0-9_.-]{2,31}$"
        password:
          type: string
          minLength: 10
          maxLength: 128
        setup_code:
          type: string
          description: One-time code from the server log (or ERVISIO_LOGS_SETUP_CODE). Needed only for the first account.
      additionalProperties: false
    Me:
      type: object
      required: [user, workspaces]
      properties:
        user:
          $ref: "#/components/schemas/User"
        workspaces:
          type: array
          items:
            $ref: "#/components/schemas/Workspace"
        csrf_token:
          type: string
          description: "Send as `X-CSRF-Token` on every POST, PATCH and DELETE made with the session cookie."
      additionalProperties: false
    ProviderRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        type:
          type: string
          enum: [s3, sftp, local]
        config:
          type: object
          description: "Non-secret settings of the provider type (endpoint, bucket, host, path...). Unknown fields are refused."
        secret_file:
          type: [string, "null"]
          description: File name inside the secrets directory that holds the credentials.
      additionalProperties: false
    StorageProvider:
      type: object
      required: [id, name, type, config, secret_file, active, status, last_error, last_checked_at, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
          enum: [s3, sftp, local]
        config:
          type: object
        secret_file:
          type: [string, "null"]
        active:
          type: boolean
        status:
          type: string
          enum: [unknown, ok, error]
        last_error:
          type: [string, "null"]
        last_checked_at:
          type: [string, "null"]
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    StorageOverview:
      type: object
      required: [providers, segments, archiver_enabled]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/StorageProvider"
        segments:
          type: object
          description: Segment count and bytes by state.
          additionalProperties:
            type: object
            required: [count, bytes]
            properties:
              count:
                type: integer
              bytes:
                type: integer
            additionalProperties: false
        archiver_enabled:
          type: boolean
        usage:
          type: object
          description: Present when the archiver runs and ClickHouse answers.
          required: [hot_bytes, cache_bytes, max_bytes, high_pct, low_pct, over_capacity]
          properties:
            hot_bytes:
              type: integer
            cache_bytes:
              type: integer
            max_bytes:
              type: integer
            high_pct:
              type: integer
            low_pct:
              type: integer
            over_capacity:
              type: boolean
          additionalProperties: false
      additionalProperties: false
    RetentionPolicy:
      type: object
      required: [scope_type, scope_id, local_age_hours, global_age_hours, updated_by, updated_at]
      properties:
        scope_type:
          type: string
          enum: [instance, workspace, project, stream]
        scope_id:
          type: string
          format: uuid
        local_age_hours:
          type: [integer, "null"]
        global_age_hours:
          type: [integer, "null"]
        cache_max_bytes:
          type: integer
        high_pct:
          type: integer
        low_pct:
          type: integer
        updated_by:
          type: [string, "null"]
          format: uuid
        updated_at:
          type: string
          format: date-time
      additionalProperties: false
    SettingEntry:
      type: object
      required: [key, type, value, source, inherited, locked]
      properties:
        key:
          type: string
        type:
          type: string
          enum: [bool, int, duration, choice, string]
        value:
          type: [boolean, integer, string]
          description: "Effective value. Durations are whole seconds."
        source:
          type: string
          enum: [env, instance, workspace, project, default]
        inherited:
          type: [boolean, integer, string]
          description: The value this level would get without its own override.
        locked:
          type: boolean
          description: "Set by an environment variable; change it on the server."
        env:
          type: string
          description: The environment variable that sets this key.
        min:
          type: integer
        max:
          type: integer
        options:
          type: array
          items:
            type: string
      additionalProperties: false
    ExportRequest:
      description: "A SearchRequest without `limit`, `cursor` and `include_total`, plus the output format."
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        query:
          type: string
        severity_min:
          type: integer
          minimum: 0
          maximum: 255
        levels:
          type: array
          items:
            type: string
        streams:
          type: array
          items:
            type: string
        environments:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            type: string
        trace_id:
          type: string
        filters:
          type: array
          items:
            type: object
        format:
          type: string
          enum: [ndjson, csv]
          default: ndjson
      additionalProperties: false
    SavedFilter:
      description: "The filter fields of a SearchRequest. `range` is a relative window such as `15m`, `24h` or `7d` (at most 31 days); alert rules ignore it and use their own window."
      type: object
      properties:
        range:
          type: string
        query:
          type: string
        severity_min:
          type: integer
          minimum: 0
          maximum: 255
        levels:
          type: array
          items:
            type: string
        streams:
          type: array
          items:
            type: string
        environments:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            type: string
        trace_id:
          type: string
        filters:
          type: array
          items:
            type: object
            required: [field, op]
            properties:
              field:
                type: string
              op:
                type: string
                enum: [eq, neq, contains, exists, gt, gte, lt, lte]
              value:
                type: string
            additionalProperties: false
      additionalProperties: false
    SavedQueryRequest:
      type: object
      required: [project_id, name, query]
      properties:
        project_id:
          type: string
          format: uuid
        name:
          type: string
          minLength: 1
          maxLength: 100
        query:
          $ref: "#/components/schemas/SavedFilter"
      additionalProperties: false
    SavedQuery:
      type: object
      required: [id, workspace_id, project_id, name, query, created_by, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        name:
          type: string
        query:
          $ref: "#/components/schemas/SavedFilter"
        created_by:
          type: [string, "null"]
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ChannelCreateRequest:
