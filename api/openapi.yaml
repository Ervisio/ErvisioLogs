        "503":
          $ref: "#/components/responses/IngestUnavailable"
  /api/v1/ingest/batch:
    post:
      tags: [logs]
      operationId: ingestBatch
      summary: "Ingest up to 1000 events (API token with logs:ingest)"
      description: "Valid events are accepted and invalid ones rejected one by one: a 202 can carry `rejected > 0`. `stream` and `environment` at the top level are defaults for events that omit them. All accepted events of one request are stored together or not at all."
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [events]
              properties:
                stream:
                  type: string
                environment:
                  type: string
                events:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items:
                    $ref: "#/components/schemas/InEvent"
              additionalProperties: false
      responses:
        "202":
          description: "Durably queued. Check `rejected` and `errors`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedEncoding"
        "422":
          description: "No event was accepted (`IngestResult`), or the batch is empty or holds more than 1000 events (problem)."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IngestResult"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/IngestUnavailable"
  /api/v1/logs/search:
    post:
      tags: [logs]
      operationId: searchLogs
      summary: "Search events (logs:read)"
      description: "Newest first. The time range defaults to the last 24 hours and spans at most 31 days. Pass `next_cursor` back as `cursor` for the next page. `include_total` adds the number of matching events and a count per level over the whole range, not only the page. API tokens may omit `project_id`; sessions must send it."
      security:
        - sessionCookie: []
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: A page of events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          description: ClickHouse is unavailable or search is not configured.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "504":
          description: The query ran longer than 30 seconds. Narrow the time range or the filters.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/logs/tail:
    get:
      tags: [logs]
      operationId: tailLogs
      summary: "Live tail as Server-Sent Events (logs:read)"
      description: |
        Streams events as this instance writes them to ClickHouse. Frames:
        - `event: log` with `id` (resume cursor) and a `LogItem` as `data`;
        - `event: reset` when `Last-Event-ID` is older than the instance's memory (10000 events): the client missed events and should reload with a search;
        - `event: overflow` before the server closes a client that fell behind; reconnect with `Last-Event-ID`;
        - a `: heartbeat` comment every 15 seconds.
        With several API instances a connection sees only events written by its own instance.
      security:
        - sessionCookie: []
        - bearerToken: []
      parameters:
        - name: project_id
          in: query
          description: Required with a session; optional with an API token.
          schema:
            type: string
            format: uuid
        - name: streams
          in: query
          description: Comma-separated stream names.
          schema:
            type: string
        - name: environments
          in: query
          description: Comma-separated environment names.
          schema:
            type: string
        - name: levels
          in: query
          description: Comma-separated levels.
          schema:
            type: string
        - name: events
          in: query
          description: Comma-separated event names.
          schema:
            type: string
        - name: severity_min
          in: query
          schema:
            type: integer
            minimum: 0
            maximum: 255
        - name: query
          in: query
          description: Case-insensitive substring of the message.
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          schema:
            type: string
      responses:
        "200":
          description: Event stream.
          content:
            text/event-stream:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          description: "Too many open live tail connections (Retry-After: 10), or tail is not configured."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /api/v1/tokens:
    get:
      tags: [tokens]
      operationId: listTokens
      summary: "List API tokens of a project (needs tokens:manage)"
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Tokens. Never includes the secret.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ApiToken"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Invalid"
    post:
      tags: [tokens]
      operationId: createToken
      summary: "Create an API token (needs tokens:manage)"
      description: "A token is bound to one project and carries a subset of `logs:ingest`, `logs:read`, `logs:export`. A creator cannot grant a scope they do not hold. A token never exceeds its creator: at every request its effective scopes are those it was created with that the creator's current role still allows, and it stops working while the creator is disabled, is not a member of the workspace, or no scope remains. These conditions revoke nothing: restoring the creator restores the token. Only an HMAC of the token is stored."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name, scopes]
              properties:
                project_id:
                  type: string
                  format: uuid
                name:
                  type: string
                  maxLength: 100
                scopes:
                  type: array
                  items:
                    type: string
                    enum: ["logs:ingest", "logs:read", "logs:export"]
                  minItems: 1
                expires_at:
                  type: [string, "null"]
                  format: date-time
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "201":
          description: "Created. `token` is shown once and cannot be retrieved again."
          content:
            application/json:
              schema:
                type: object
                required: [token, api_token]
                properties:
                  token:
                    type: string
                    examples: [evl_...]
                  api_token:
                    $ref: "#/components/schemas/ApiToken"
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
  /api/v1/tokens/current:
    get:
      tags: [tokens]
      operationId: getCurrentToken
      summary: Describe the API token used for this call
      description: "Send `Authorization: Bearer evl_...`. `scopes` are the effective ones, reduced to what the creator's current role allows. Fails with 401 once the token is revoked or expired, while its creator is disabled or no longer a member of the workspace, or when no scope remains. Ingestion, search and live tail authenticate the same way."
      security:
        - bearerToken: []
      responses:
        "200":
          description: "The token's metadata."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
  "/api/v1/tokens/{id}":
    delete:
      tags: [tokens]
      operationId: revokeToken
      summary: "Revoke an API token (needs tokens:manage)"
      description: Takes effect immediately.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Token id.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Revoked (also when it already was).
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/admin/audit:
    get:
      tags: [admin, audit]
      operationId: adminListAudit
      summary: Instance-level audit trail (instance administrator)
      description: "Events without a workspace: sign-ins, failed sign-ins, registrations, account changes and workspace deletions. A failed password sign-in targets the user, or for an unknown login a keyed digest of it (target type `login`), never the text typed."
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: cursor
          in: query
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Events, newest first."
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditEvent"
                  next_cursor:
                    type: [string, "null"]
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      summary: List accounts (instance administrator)
      description: "Oldest first. `q` matches part of the email or username, ignoring case. Pass `next_cursor` back as `cursor` for the next page."
      parameters:
        - name: q
          in: query
          schema:
            type: string
            maxLength: 320
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          schema:
            type: string
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/User"
                  next_cursor:
                    type: [string, "null"]
                additionalProperties: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "422":
          $ref: "#/components/responses/Invalid"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [admin]
      operationId: adminCreateUser
      summary: Create an account (instance administrator)
      description: "Without `password` the account can only sign in through an external provider; the first sign-in with a verified email proves ownership of the address. The instance administrator gets no access to workspace data from this."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, username]
              properties:
                email:
                  type: string
                  format: email
                username:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_.-]{2,31}$"
                password:
                  type: string
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/api/v1/admin/users/{id}":
    get:
      tags: [admin]
      operationId: adminGetUser
      summary: One account (instance administrator)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User id.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [admin]
      operationId: adminDeleteUser
      summary: Delete an account (instance administrator)
      description: "Removes the account, its sessions and memberships; API tokens it created stop working. Refused for your own account (422), for the last active administrator and for the only owner of a workspace (409)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User id.
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Invalid"
    patch:
      tags: [admin]
      operationId: adminUpdateUser
      summary: Enable, disable, promote or demote an account (instance administrator)
      description: "Set `status`, `is_instance_admin` or both; the change is applied as a whole. Your own account is refused (422). The instance always keeps one active administrator (409)."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: User id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status:
                  type: string
                  enum: [active, disabled]
                is_instance_admin:
                  type: boolean
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Updated. Disabling revokes every session of the user.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
