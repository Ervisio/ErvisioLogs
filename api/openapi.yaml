      summary: "Export matching events (logs:export)"
      description: "Streams every event matching the filter, newest first, as NDJSON (default) or CSV, up to the instance cap (ERVISIO_LOGS_EXPORT_MAX_ROWS). `limit` and `cursor` are rejected. When the cap cuts the export short the `X-Export-Truncated: true` trailer is sent; when the stream fails midway the `X-Export-Error` trailer is sent. CSV cells that start with = + - @ tab or CR get a leading quote. Every export is audited as `logs.export`."
