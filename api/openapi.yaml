          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/admin/retention/{scopeType}/{scopeId}:
    put:
      tags: [admin]
      operationId: adminPutRetention
      summary: Set the retention policy of a scope
      description: "The instance policy needs every field. Overrides set only ages, inherited field by field (stream > project > workspace > instance)."
      parameters:
        - name: scopeType
          in: path
          required: true
          schema:
            type: string
            enum: [instance, workspace, project, stream]
        - name: scopeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: "Id of the workspace, project or stream. The instance policy uses the nil UUID."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                local_age_hours:
                  type: integer
                  minimum: 1
                global_age_hours:
                  type: integer
                  minimum: 1
                cache_max_bytes:
                  type: integer
                  minimum: 1048576
                high_pct:
                  type: integer
                  minimum: 1
                  maximum: 100
                low_pct:
                  type: integer
                  minimum: 1
                  maximum: 99
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "200":
