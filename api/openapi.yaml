openapi: "3.1.0"
info:
  title: Ervisio Logs API
  version: "0.3.0"
  summary: "Authentication, tenancy, RBAC, API tokens, audit, ingestion, search and live tail."
  description: |
    Base path for feature routes is `/api/v1`. Errors use RFC 7807 `application/problem+json` and carry the `request_id` also returned in `X-Request-ID`.

    Browser sessions use an HttpOnly cookie. Every POST, PATCH and DELETE made with the cookie must send the `X-CSRF-Token` returned by `/auth/login`, `/auth/register` or `/auth/me`, and a browser `Origin` header must match the public URL. API tokens (`Authorization: Bearer evl_...`) are project-scoped and cannot call user routes.

    This document is checked against the implemented routes by `TestOpenAPIMatchesRouter`: an undocumented or unimplemented route fails the test suite.
  license:
    name: TBD (to be decided by the project owner)
    identifier: NOASSERTION
servers:
  - url: "http://localhost:8080"
    description: Local development
tags:
  - name: health
    description: "Process and dependency probes (unauthenticated, no sensitive detail)."
  - name: auth
    description: Local and external sign-in.
  - name: workspaces
  - name: members
  - name: projects
    description: "Projects, environments and streams."
  - name: logs
    description: "Ingestion, search and live tail."
  - name: queries
    description: Saved searches.
  - name: alerts
    description: "Alert rules and notification channels."
  - name: tokens
  - name: audit
  - name: admin
    description: Instance administrator only. Grants no access to workspace data.
paths:
  /healthz:
    get:
      tags: [health]
      operationId: getLiveness
      summary: Liveness probe
      description: Reports that the process is running. Never checks dependencies.
      security: []
      responses:
        "200":
          description: Process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Liveness"
  /readyz:
    get:
      tags: [health]
      operationId: getReadiness
      summary: Readiness probe
      description: Succeeds only when PostgreSQL and ClickHouse answer and both schemas are at the version this binary expects. Results are cached for a few seconds. Failure reasons are logged server-side and never returned.
      security: []
      responses:
        "200":
          description: Ready to serve traffic.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
        "503":
          description: At least one check failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Readiness"
  /metrics:
    get:
      tags: [health]
      operationId: getMetrics
      summary: Prometheus metrics
      description: "Prometheus text format: WAL size and backlog, ClickHouse insert counters and lag, open live tail connections. When `ERVISIO_LOGS_METRICS_TOKEN` is set, send it as `Authorization: Bearer <token>`. Without a token the route answers only in development and returns 404 in production."
      security:
        - metricsToken: []
        - {}
      responses:
        "200":
          description: Metrics.
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/providers:
    get:
      tags: [auth]
      operationId: listAuthProviders
      summary: Sign-in methods and instance state
      description: Public. The login page uses it to draw the provider buttons and to detect a fresh install.
      security: []
      responses:
        "200":
          description: Enabled providers.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviders"
  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: "Create an account with email, username and password"
      description: "On a fresh install (no users) `setup_code` is required and the account becomes the instance administrator. Afterwards registration works only when `open_registration` is true; otherwise an administrator creates accounts or invites addresses. When email is configured a verification link is sent. Password: 10 to 128 bytes."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      security: []
      responses:
        "201":
          description: Account created and signed in. Sets the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooMany"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with email or username and password
      description: "Attempts are rate limited per IP, per account and client IP, and per account across all IPs with a higher threshold (`429` with `Retry-After`). The email and the username of an account share its counters. The answer is identical for unknown accounts, accounts without a password, disabled accounts and wrong passwords."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                  description: Email or username.
                password:
                  type: string
              additionalProperties: false
      security: []
      responses:
        "200":
          description: Signed in. Sets the HttpOnly session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "429":
          $ref: "#/components/responses/TooMany"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out and revoke the session
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Session revoked.
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: "Current user, workspaces and CSRF token"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change the password of the signed-in account
      description: "Needs the current password; wrong guesses share the sign-in rate limits of the account. Every other session of the account is revoked, this one stays."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                new_password:
                  type: string
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: "The current password is not correct, or the CSRF check failed."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "409":
          description: The account signs in through an external provider and has no password.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooMany"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/sessions:
    get:
      tags: [auth]
      operationId: listOwnSessions
      summary: Sessions of the signed-in account
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Live sessions, most recently used first."
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Session"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [auth]
      operationId: revokeOtherSessions
      summary: Sign out everywhere else
      description: Revokes every session of the account except the one making the request.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Sessions revoked.
          content:
            application/json:
              schema:
                type: object
                required: [revoked]
                properties:
                  revoked:
                    type: integer
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  "/api/v1/auth/sessions/{sessionId}":
    delete:
      tags: [auth]
      operationId: revokeOwnSession
      summary: Revoke one session of the signed-in account
      description: Revoking the current session also clears its cookie.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      summary: Email a password reset link
      description: "The answer is `202` whether or not the address has an account. The link (`/reset-password#token=...`) works once, for one hour, and replaces earlier ones. Limited per IP and per address."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
              additionalProperties: false
      security: []
      responses:
        "202":
          description: Accepted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Email is not configured on this instance.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "429":
          $ref: "#/components/responses/TooMany"
  /api/v1/auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      summary: Set a new password with a reset link
      description: "Uses the token from the link fragment. Every session of the account is revoked and the address counts as verified."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                password:
                  type: string
                  minLength: 10
                  maxLength: 128
              additionalProperties: false
      security: []
      responses:
        "204":
          description: Password changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "503":
          $ref: "#/components/responses/Unavailable"
  /api/v1/auth/email/verify:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email address with a verification link
      description: "Uses the token from the link fragment (`/verify-email#token=...`). The link works once, for 48 hours."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      security: []
      responses:
        "204":
          description: Verified.
        "400":
          $ref: "#/components/responses/BadRequest"
        "410":
          $ref: "#/components/responses/Gone"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
  /api/v1/auth/email/verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Send a new verification link to the signed-in account
      description: "Replaces the earlier link. Limited to three an hour per account."
      security:
        - sessionCookie: []
      responses:
        "202":
          description: Sent.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The address is already verified, or email is not configured."
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "429":
          $ref: "#/components/responses/TooMany"
  "/api/v1/auth/oauth/{provider}/start":
    get:
      tags: [auth]
      operationId: oauthStart
      summary: Start a sign-in with an external provider
      description: "Providers: `google` and `cognito` (OpenID Connect, the ID token is verified for signature, issuer, audience, expiry and nonce) and `discord` (OAuth 2.0). Only providers listed by `/auth/providers` exist."
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, cognito, discord]
      security: []
      responses:
        "302":
          description: "Redirect to the provider authorisation page (authorisation code flow with PKCE S256, state and, for OpenID Connect, nonce)."
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooMany"
        "502":
          description: The provider could not be reached.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  "/api/v1/auth/oauth/{provider}/callback":
    get:
      tags: [auth]
      operationId: oauthCallback
      summary: Complete a sign-in with an external provider
      description: "Accounts are linked by (provider, subject). A verified provider email may link to an existing account unless that account is disabled (`account_disabled`), has a password and an unverified email (`email_in_use`), or already has another identity of this provider (`identity_conflict`). The callback must come from the browser that started the flow, proved by a cookie set at start (otherwise `invalid_state`). New accounts are created only when registration is open and the instance is already set up."
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [google, cognito, discord]
        - name: code
          in: query
          schema:
            type: string
        - name: state
          in: query
          schema:
            type: string
      security: []
      responses:
        "303":
          description: "Redirects to `/` with the session cookie set, or to `/login?error=<code>`. Codes: provider_denied, invalid_request, invalid_state, exchange_failed, email_unverified, email_in_use, identity_conflict, registration_closed, setup_required, account_disabled, server_error."
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooMany"
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      operationId: listWorkspaces
      summary: "List the caller's workspaces"
      security:
        - sessionCookie: []
      responses:
        "200":
          description: "Workspaces with the caller's role."
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [workspaces]
      operationId: createWorkspace
      summary: Create a workspace (the caller becomes owner)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
                slug:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9-]{0,38}$"
                  description: Defaults to a slug of the name.
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/workspaces/{id}":
    get:
      tags: [workspaces]
      operationId: getWorkspace
      summary: "Get a workspace and the caller's permissions"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace id.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Workspace.
          content:
            application/json:
              schema:
                type: object
                required: [workspace, permissions]
                properties:
                  workspace:
                    $ref: "#/components/schemas/Workspace"
                  permissions:
                    type: array
                    items:
                      type: string
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [workspaces]
      operationId: updateWorkspace
      summary: "Rename a workspace (needs workspace:manage)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 100
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
    delete:
      tags: [workspaces]
      operationId: deleteWorkspace
      summary: "Delete a workspace and everything in it (needs workspace:manage)"
      description: Destructive. The body must repeat the workspace slug.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm:
                  type: string
                  description: Must equal the workspace slug.
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Deleted.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
  "/api/v1/workspaces/{id}/members":
    get:
      tags: [members]
      operationId: listMembers
      summary: List members
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace id.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Members.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Member"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [members]
      operationId: addMember
      summary: "Add an existing account to the workspace (needs members:manage)"
      description: Only an owner can grant the owner role.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/Role"
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
        "409":
          $ref: "#/components/responses/Conflict"
  "/api/v1/workspaces/{id}/invitations":
    get:
      tags: [members]
      operationId: listInvitations
      summary: "Pending invitations, newest first (needs members:manage)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace id.
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Invitations.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [members]
      operationId: createInvitation
      summary: "Invite an email address, with or without an account (needs members:manage)"
      description: "When email is configured the link goes to the address and `url` is absent; accepting an emailed link verifies the address. Otherwise, or when delivery fails (`mail_error`), the response carries `url` for the inviter to share. Inviting the same address again replaces the earlier link. The link (`/invite#token=...`) works once, for 7 days. Only an owner can grant the owner role."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace id.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, role]
              properties:
                email:
                  type: string
                  format: email
                role:
                  $ref: "#/components/schemas/Role"
              additionalProperties: false
      security:
        - sessionCookie: []
      responses:
        "201":
          description: Invited.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedInvitation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The address already belongs to a member.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "422":
          $ref: "#/components/responses/Invalid"
  "/api/v1/workspaces/{id}/invitations/{invitationId}":
    delete:
      tags: [members]
      operationId: deleteInvitation
      summary: "Revoke an invitation (needs members:manage)"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace id.
        - name: invitationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      security:
        - sessionCookie: []
      responses:
