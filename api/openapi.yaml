      responses:
        "200":
          description: History.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/AlertEvent"
                additionalProperties: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/logs:
    post:
      tags: [logs]
      operationId: otlpLogs
      summary: "OTLP/HTTP log ingest (logs:ingest, not yet validated)"
      description: "Accepts an OTLP ExportLogsServiceRequest as application/x-protobuf or application/json, optionally gzip encoded, with at most 1000 log records. ADR 0010 describes the mapping. Interoperability with OpenTelemetry collectors has not been validated yet. Error bodies are problem JSON, not google.rpc.Status."
      security:
        - bearerToken: []
      requestBody:
        required: true
        content:
          application/x-protobuf:
            schema:
              type: string
              format: binary
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: "Records accepted; `partialSuccess` reports rejected records."
          content:
            application/x-protobuf:
              schema:
                type: string
                format: binary
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedEncoding"
        "503":
          $ref: "#/components/responses/IngestUnavailable"
components:
  securitySchemes:
    metricsToken:
      type: http
      scheme: bearer
      description: "The value of ERVISIO_LOGS_METRICS_TOKEN."
    bearerToken:
      type: http
      scheme: bearer
      description: "Project-scoped API token (`evl_...`), shown once at creation."
    sessionCookie:
      type: apiKey
      in: cookie
      name: ervisio_logs_session
      description: "HttpOnly, SameSite=Lax session cookie. Mutations also need the X-CSRF-Token header."
  responses:
    BadRequest:
      description: "Malformed JSON, unknown field, trailing data or invalid pagination cursor."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: The request body exceeds the size limit.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: "Too many password operations are in progress; retry shortly."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
    Unauthorized:
      description: Authentication required or credentials invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: "Authenticated but not allowed: missing permission, missing or wrong CSRF token, or cross-origin request."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: "Not found. Also returned when the resource belongs to a workspace the caller is not a member of, so existence is not revealed."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: "The resource already exists, or the change would remove the last owner."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Invalid:
      description: Validation failed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Gone:
      description: "The link was used, replaced, revoked or has expired."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    TooMany:
      description: Rate limited.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
    UnsupportedEncoding:
      description: "Content-Encoding is neither gzip nor absent."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    IngestUnavailable:
      description: "The ingest queue is full or the disk failed. Nothing was acknowledged; retry after Retry-After seconds."
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
      headers:
        Retry-After:
          description: Seconds to wait.
          schema:
            type: integer
  schemas:
    InEvent:
      type: object
      description: "Unknown fields are rejected. Attribute keys match `^[A-Za-z0-9_-]+$` (no dots), nest at most 8 levels and total at most 64 KiB."
      properties:
        id:
          type: string
          maxLength: 128
          description: "Idempotency key; generated when absent. Resending the same id does not create a duplicate in search results."
        stream:
          type: string
          description: "Stream name; default `default`."
        environment:
          type: string
          description: "Environment name; default from the batch."
        timestamp:
          type: string
          format: date-time
          description: "RFC 3339; default the time of arrival. Stored with millisecond precision."
        level:
          type: string
          description: "TRACE, DEBUG, INFO, NOTICE, WARN, ERROR or FATAL, any case; default INFO. WARNING folds to WARN and CRITICAL to FATAL."
        event:
          type: string
          maxLength: 128
        message:
          type: string
          maxLength: 32768
        service:
          type: string
          maxLength: 256
        host:
          type: string
          maxLength: 256
        resource:
          type: string
          maxLength: 256
        trace_id:
          type: string
        span_id:
          type: string
        attributes:
          type: object
      additionalProperties: false
    IngestResult:
      type: object
      required: [request_id, accepted, rejected, status, errors]
      properties:
        request_id:
          type: string
        accepted:
          type: integer
        rejected:
          type: integer
        status:
          type: string
          enum: [durably_queued, rejected]
        errors:
          type: array
          items:
            type: object
            required: [index, reason]
            properties:
              index:
                type: integer
                description: Position of the event in the request.
              reason:
                type: string
      additionalProperties: false
    SearchRequest:
      type: object
      properties:
        project_id:
          type: string
          format: uuid
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        query:
          type: string
          description: Case-insensitive substring of the message.
        severity_min:
          type: integer
          minimum: 0
          maximum: 255
        levels:
          type: array
          items:
            type: string
        streams:
          type: array
          items:
            type: string
        environments:
          type: array
          items:
            type: string
        events:
          type: array
          items:
            type: string
        services:
          type: array
          items:
            type: string
        trace_id:
          type: string
        filters:
          type: array
          items:
            type: object
            required: [field, op]
            properties:
              field:
                type: string
                description: "Attribute path with dots between keys, for example `player.license`."
              op:
                type: string
                enum: [eq, neq, contains, exists, gt, gte, lt, lte]
              value:
                type: string
            additionalProperties: false
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
        cursor:
          type: string
        include_total:
          type: boolean
      additionalProperties: false
    LogItem:
      type: object
      required: [id, timestamp, ingested_at, level, severity_number, event, message, stream, environment, service, host, resource, trace_id, span_id, attributes]
      properties:
        id:
          type: string
        timestamp:
          type: string
          format: date-time
        ingested_at:
          type: string
          format: date-time
        level:
          type: string
        severity_number:
          type: integer
        event:
          type: string
        message:
          type: string
        stream:
          type: string
        environment:
          type: string
        service:
          type: string
        host:
          type: string
        resource:
          type: string
        trace_id:
          type: string
        span_id:
          type: string
        attributes:
          type: object
    SearchResult:
      type: object
      required: [items, next_cursor, execution_stats, searched_tiers, partial]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/LogItem"
        next_cursor:
          type: [string, "null"]
        total:
          type: integer
          description: Present when include_total was true.
        level_counts:
          type: object
          additionalProperties:
            type: integer
          description: Present when include_total was true.
        execution_stats:
          type: object
          properties:
            elapsed_ms:
              type: integer
            rows_read:
              type: integer
            bytes_read:
              type: integer
        searched_tiers:
          type: array
          items:
            type: string
            enum: [hot]
        partial:
          type: boolean
    Liveness:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          examples: ["0.1.0"]
      additionalProperties: false
    Readiness:
      type: object
      required: [status, checks]
      properties:
        status:
          type: string
          enum: [ready, not_ready]
        checks:
          type: object
          description: Result per check name.
          additionalProperties:
            type: string
            enum: [ok, fail]
      additionalProperties: false
    Problem:
      type: object
      description: RFC 7807 problem document.
      required: [type, title, status]
      properties:
        type:
          type: string
          examples: ["about:blank"]
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        request_id:
          type: string
          examples: [req_9f2c4a1b7e3d5a60b1c2d3e4]
    Role:
      type: string
      enum: [owner, admin, developer, analyst, viewer]
    User:
      type: object
      required:
        - id
        - email
        - username
        - email_verified
        - is_instance_admin
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        username:
          type: string
        email_verified:
          type: boolean
        is_instance_admin:
          type: boolean
        status:
          type: string
          enum: [active, disabled]
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    Session:
      type: object
      required: [id, created_at, expires_at, last_seen_at, ip, user_agent, current]
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
          description: Refreshed at most once a minute.
        ip:
          type: string
          description: Client address of the last use.
        user_agent:
          type: string
        current:
          type: boolean
          description: The session making the request.
      additionalProperties: false
    Workspace:
      type: object
      required: [id, slug, name, created_at]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        created_at:
          type: string
          format: date-time
        role:
          $ref: "#/components/schemas/Role"
      additionalProperties: false
    TokenRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: "The `token` from the link's URL fragment."
      additionalProperties: false
    Invitation:
      type: object
      required: [id, workspace_id, email, role, invited_by, emailed, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        workspace_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/Role"
        invited_by:
          type: [string, "null"]
          format: uuid
        emailed:
          type: boolean
          description: The link went to the invited address only.
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
      additionalProperties: false
    CreatedInvitation:
      allOf:
        - $ref: "#/components/schemas/Invitation"
        - type: object
          properties:
            url:
              type: string
              format: uri
              description: The link to share; present only when it was not emailed.
            mail_error:
              type: string
              description: Why the email was not sent.
    InvitationPreview:
      type: object
