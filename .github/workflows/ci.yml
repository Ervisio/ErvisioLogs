name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: go vet ./...
        working-directory: backend
      - run: test -z "$(gofmt -l .)"
        working-directory: backend
      - run: go test -race ./...
        working-directory: backend
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run typecheck && npm test && npm run build
        working-directory: web
  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24 }
      - run: npx --yes @redocly/cli@2.72.1 lint api/openapi.yaml # version: keep in sync with the Makefile
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      # Throwaway databases started from Compose, so their digests have one source of truth.
      - run: scripts/gen-env.sh
      - run: docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.dev.yaml up -d --wait --wait-timeout 180 postgres clickhouse
      - run: make test-integration
      - if: failure()
        run: docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.dev.yaml logs --tail=100 postgres clickhouse
      - if: always()
        run: docker compose --env-file .env -f deploy/compose.yaml -f deploy/compose.dev.yaml down -v
  smoke:
    runs-on: ubuntu-latest
    needs: [backend, web, integration]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: scripts/smoke.sh
  e2e:
    runs-on: ubuntu-latest
    needs: [backend, web]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 24, cache: npm, cache-dependency-path: web/package-lock.json }
      # Builds the image, starts a throwaway stack with random secrets and runs Playwright against it.
      - run: scripts/e2e.sh
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: playwright-report, path: "web/playwright-report\nweb/test-results", retention-days: 7 }
